name: Build e publicar release (auto-update)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Checkout (com tags, para calcular a versão)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências (raiz)
        run: npm ci

      - name: Instalar dependências (web)
        run: npm --prefix web ci

      # A versão é aplicada só no runner (sem commit de volta no repositório).
      - name: Calcular versão
        id: versao
        shell: bash
        run: |
          git fetch --tags --force
          V=$(node scripts/proximaVersao.cjs)
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "Versão a publicar: $V"
          echo "versao=$V" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Compilar e publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win
